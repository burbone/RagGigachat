<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Ассистент</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #16161f;
      --border: #1e1e2e;
      --border2: #2a2a3e;
      --accent: #00ff88;
      --accent2: #00aaff;
      --accent3: #ff6b35;
      --text: #e8e8f0;
      --muted: #555570;
      --muted2: #3a3a55;
      --error: #ff4466;
      --warn: #ffaa00;
      --table-color: #a78bfa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 64px 1fr;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(30,30,46,0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,30,46,0.5) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none; z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative; z-index: 10;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(8px);
    }

    .logo-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }

    .logo-text {
      font-family: 'Unbounded', sans-serif;
      font-size: 12px; font-weight: 300;
      letter-spacing: .22em; text-transform: uppercase;
    }
    .logo-text span { color: var(--accent); }

    .header-status {
      margin-left: auto;
      display: flex; align-items: center; gap: 10px;
    }
    .badge {
      font-size: 10px; letter-spacing: .12em;
      padding: 3px 10px; border-radius: 2px;
      border: 1px solid var(--border2);
      color: var(--muted);
      transition: all .3s;
    }
    .badge.ready { color: var(--accent); border-color: rgba(0,255,136,.3); background: rgba(0,255,136,.04); }
    .badge.warn  { color: var(--warn);  border-color: rgba(255,170,0,.3);  background: rgba(255,170,0,.04); }

    /* ── LAYOUT ── */
    main {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 64px);
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .sidebar-scroll {
      flex: 1; overflow-y: auto; padding: 24px 20px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 3px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border2); }

    .section-label {
      font-size: 9px; letter-spacing: .28em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 10px;
    }

    /* Upload zone */
    .upload-zone {
      border: 1px dashed var(--border2);
      border-radius: 4px; padding: 24px 12px;
      text-align: center; cursor: pointer;
      position: relative; transition: all .2s;
    }
    .upload-zone:hover, .upload-zone.drag {
      border-color: var(--accent);
      background: rgba(0,255,136,.03);
    }
    .upload-zone input {
      position: absolute; inset: 0; opacity: 0;
      cursor: pointer; width: 100%;
    }
    .upload-icon { font-size: 22px; margin-bottom: 8px; display: block; }
    .upload-zone p { font-size: 10px; color: var(--muted); line-height: 1.7; }
    .upload-zone p strong { color: var(--text); display: block; }

    /* File chip */
    .file-chip {
      display: none; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 3px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      font-size: 10px;
    }
    .file-chip.visible { display: flex; }
    .file-chip .fname { color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-chip .fsize { color: var(--muted); flex-shrink: 0; }

    /* Progress */
    .progress-wrap { display: none; }
    .progress-wrap.active { display: block; }
    .progress-track { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .4s ease;
    }
    .progress-label { font-size: 9px; color: var(--muted); margin-top: 5px; letter-spacing: .1em; }

    /* Btn */
    .btn {
      width: 100%; padding: 10px;
      background: transparent;
      border: 1px solid var(--accent); color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; letter-spacing: .18em;
      text-transform: uppercase; cursor: pointer;
      border-radius: 2px; transition: all .2s;
    }
    .btn:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
    .btn:disabled { border-color: var(--border2); color: var(--muted); cursor: not-allowed; }

    /* Doc stats */
    .doc-stats {
      display: none; flex-direction: column; gap: 6px;
    }
    .doc-stats.visible { display: flex; }
    .stat-row {
      display: flex; justify-content: space-between;
      font-size: 10px; padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--muted); }
    .stat-val { color: var(--text); font-weight: 500; }
    .stat-val.accent { color: var(--accent); }
    .stat-val.warn { color: var(--warn); }
    .stat-val.table { color: var(--table-color); }

    /* Warnings */
    .warnings-box {
      display: none; padding: 10px;
      border: 1px solid rgba(255,170,0,.25);
      border-radius: 3px; background: rgba(255,170,0,.03);
    }
    .warnings-box.visible { display: block; }
    .warn-title { font-size: 9px; color: var(--warn); letter-spacing: .15em; margin-bottom: 6px; }
    .warn-item { font-size: 9px; color: rgba(255,170,0,.7); line-height: 1.7; }
    .warn-item::before { content: '⚠ '; }

    /* Log */
    .log { flex: 1; overflow-y: auto; font-size: 9px; color: var(--muted); line-height: 1.9; }
    .log::-webkit-scrollbar { width: 2px; }
    .log-line { padding: 1px 0; }
    .log-line.ok  { color: var(--accent); }
    .log-line.err { color: var(--error); }
    .log-line.info{ color: var(--accent2); }
    .log-line::before { content: '› '; opacity: .5; }

    /* ── CHAT PANEL ── */
    .chat-panel {
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1; overflow-y: auto;
      padding: 32px 40px;
      display: flex; flex-direction: column; gap: 28px;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border2); }

    .empty-state {
      margin: auto; text-align: center; color: var(--muted);
      user-select: none;
    }
    .empty-big {
      font-family: 'Unbounded', sans-serif;
      font-size: 56px; font-weight: 300;
      opacity: .08; letter-spacing: .05em;
    }
    .empty-sub { font-size: 10px; letter-spacing: .14em; margin-top: 12px; }

    /* Messages */
    .message { animation: fadeUp .25s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

    .message.user { display: flex; justify-content: flex-end; }
    .message.bot  { display: flex; gap: 12px; align-items: flex-start; }

    .avatar {
      width: 28px; height: 28px; border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 500; flex-shrink: 0; margin-top: 2px;
    }
    .message.bot .avatar { background: rgba(0,255,136,.08); color: var(--accent); border: 1px solid rgba(0,255,136,.2); }

    .bubble {
      padding: 14px 18px; border-radius: 3px;
      font-size: 13px; line-height: 1.75; max-width: 680px;
    }
    .message.user .bubble {
      background: rgba(0,170,255,.07);
      border: 1px solid rgba(0,170,255,.18);
      color: var(--text);
    }
    .message.bot .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      flex: 1;
    }

    /* Sources */
    .sources {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .source-tag {
      font-size: 9px; letter-spacing: .1em;
      padding: 3px 8px; border-radius: 2px;
      border: 1px solid var(--border2);
      color: var(--muted);
      display: flex; align-items: center; gap: 4px;
    }
    .source-tag.table { border-color: rgba(167,139,250,.3); color: var(--table-color); }
    .source-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* Thinking */
    .thinking { display: flex; gap: 5px; align-items: center; padding: 2px 0; }
    .dot-anim {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); opacity: .4;
      animation: blink 1.2s ease-in-out infinite;
    }
    .dot-anim:nth-child(2) { animation-delay: .2s; }
    .dot-anim:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100%{opacity:.3;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

    /* ── INPUT ── */
    .input-area {
      padding: 18px 40px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end;
      background: rgba(10,10,15,.8);
    }

    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 10px 14px;
      resize: none; outline: none;
      min-height: 44px; max-height: 110px;
      line-height: 1.5;
      transition: border-color .2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .send-btn {
      width: 44px; height: 44px; flex-shrink: 0;
      background: var(--accent); border: none; border-radius: 3px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--bg); font-size: 17px;
      transition: all .2s;
    }
    .send-btn:hover:not(:disabled) { background: #00ffaa; transform: scale(1.06); }
    .send-btn:disabled { background: var(--border2); cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <div class="logo-text">RAG <span>//</span> Ассистент</div>
  <div class="header-status">
    <div class="badge" id="statusBadge">НЕТ ДОКУМЕНТА</div>
  </div>
</header>

<main>
  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-scroll">

      <div>
        <div class="section-label">Документ</div>
        <div class="upload-zone" id="uploadZone">
          <input type="file" accept=".pdf" id="fileInput">
          <span class="upload-icon">⬆</span>
          <p><strong>Загрузить PDF</strong>перетащи или кликни</p>
        </div>
      </div>

      <div class="file-chip" id="fileChip">
        <span class="fname" id="fileName"></span>
        <span class="fsize" id="fileSize"></span>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">Загружаю...</div>
      </div>

      <button class="btn" id="indexBtn" disabled>Индексировать</button>

      <!-- Статистика документа -->
      <div>
        <div class="section-label">Анализ документа</div>
        <div class="doc-stats" id="docStats">
          <div class="stat-row"><span class="stat-label">Страниц</span><span class="stat-val accent" id="statPages">-</span></div>
          <div class="stat-row"><span class="stat-label">Чанков</span><span class="stat-val" id="statChunks">-</span></div>
          <div class="stat-row"><span class="stat-label">Таблиц найдено</span><span class="stat-val table" id="statTables">-</span></div>
        </div>
      </div>

      <!-- Предупреждения -->
      <div class="warnings-box" id="warningsBox">
        <div class="warn-title">⚠ ПРЕДУПРЕЖДЕНИЯ</div>
        <div id="warningsList"></div>
      </div>

      <!-- Лог -->
      <div>
        <div class="section-label">Лог</div>
        <div class="log" id="log"></div>
      </div>

    </div>
  </aside>

  <!-- ── CHAT ── -->
  <section class="chat-panel">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-big">ASK</div>
        <p class="empty-sub">Загрузи документ и задай вопрос</p>
      </div>
    </div>

    <div class="input-area">
      <textarea id="questionInput" placeholder="Задай вопрос по документу..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled>→</button>
    </div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const fileInput    = $('fileInput');
  const uploadZone   = $('uploadZone');
  const indexBtn     = $('indexBtn');
  const sendBtn      = $('sendBtn');
  const questionInput= $('questionInput');
  const messages     = $('messages');
  const emptyState   = $('emptyState');
  const fileChip     = $('fileChip');
  const fileName     = $('fileName');
  const fileSize     = $('fileSize');
  const progressWrap = $('progressWrap');
  const progressFill = $('progressFill');
  const progressLabel= $('progressLabel');
  const log          = $('log');
  const statusBadge  = $('statusBadge');
  const docStats     = $('docStats');
  const warningsBox  = $('warningsBox');
  const warningsList = $('warningsList');

  let selectedFile = null;
  let isIndexed = false;

  // ── LOG ──
  function addLog(msg, type = '') {
    const el = document.createElement('div');
    el.className = `log-line ${type}`;
    el.textContent = msg;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function setProgress(pct, label) {
    progressFill.style.width = pct + '%';
    if (label) progressLabel.textContent = label;
  }

  // ── DRAG & DROP ──
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f?.type === 'application/pdf') handleFile(f);
    else addLog('Только PDF файлы', 'err');
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  function handleFile(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = (file.size / 1024).toFixed(0) + ' KB';
    fileChip.classList.add('visible');
    indexBtn.disabled = false;
    docStats.classList.remove('visible');
    warningsBox.classList.remove('visible');
    addLog(`Выбран: ${file.name}`);
  }

  // ── UPLOAD & INDEX ──
  indexBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    indexBtn.disabled = true;
    sendBtn.disabled = true;
    isIndexed = false;

    progressWrap.classList.add('active');
    setProgress(10, 'Загружаю PDF...');
    addLog('Начинаю индексирование...', 'info');

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      setProgress(30, 'Анализирую структуру...');
      const res = await fetch('/upload', { method: 'POST', body: formData });
      setProgress(80, 'Строю индекс...');

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Ошибка сервера');
      }

      const data = await res.json();
      setProgress(100, 'Готово!');
      setTimeout(() => progressWrap.classList.remove('active'), 700);

      // Обновляем статистику
      $('statPages').textContent  = data.pages;
      $('statChunks').textContent = data.chunks;
      $('statTables').textContent = data.tables_found;
      docStats.classList.add('visible');

      // Предупреждения
      if (data.warnings && data.warnings.length > 0) {
        warningsList.innerHTML = '';
        data.warnings.forEach(w => {
          const el = document.createElement('div');
          el.className = 'warn-item';
          el.textContent = w;
          warningsList.appendChild(el);
        });
        warningsBox.classList.add('visible');
        addLog(`Предупреждений: ${data.warnings.length}`, 'err');
      }

      // Лог итогов
      addLog(`Страниц: ${data.pages}`, 'ok');
      addLog(`Чанков: ${data.chunks}`, 'ok');
      if (data.tables_found > 0) addLog(`Таблиц: ${data.tables_found}`, 'info');
      addLog(`Готово: ${data.filename}`, 'ok');

      isIndexed = true;
      sendBtn.disabled = false;
      statusBadge.textContent = data.filename.length > 22
        ? data.filename.slice(0, 20) + '…'
        : data.filename;
      statusBadge.classList.add('ready');
      statusBadge.classList.remove('warn');

    } catch (e) {
      addLog(`Ошибка: ${e.message}`, 'err');
      setProgress(0, '');
      progressWrap.classList.remove('active');
      indexBtn.disabled = false;
    }
  });

  // ── TEXTAREA AUTO-RESIZE ──
  questionInput.addEventListener('input', () => {
    questionInput.style.height = 'auto';
    questionInput.style.height = Math.min(questionInput.scrollHeight, 110) + 'px';
  });
  questionInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  // ── MESSAGES ──
  function hideEmpty() {
    if (emptyState) emptyState.style.display = 'none';
  }

  function addUserMessage(text) {
    hideEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'message user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    scrollBottom();
  }

  function addBotMessage() {
    hideEmpty();
    const wrap = document.createElement('div');
    wrap.className = 'message bot';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="thinking"><div class="dot-anim"></div><div class="dot-anim"></div><div class="dot-anim"></div></div>';

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    scrollBottom();
    return bubble;
  }

  function renderAnswer(bubble, answer, sources) {
    // Текст ответа
    const answerEl = document.createElement('div');
    answerEl.textContent = answer;
    bubble.innerHTML = '';
    bubble.appendChild(answerEl);

    // Источники
    if (sources && sources.length > 0) {
      const sourcesEl = document.createElement('div');
      sourcesEl.className = 'sources';

      // Дедупликация по странице
      const seen = new Set();
      sources.forEach(s => {
        const key = `${s.source}_${s.page}_${s.is_table}`;
        if (seen.has(key)) return;
        seen.add(key);

        const tag = document.createElement('div');
        tag.className = `source-tag${s.is_table ? ' table' : ''}`;
        tag.innerHTML = `<span class="dot"></span>${s.is_table ? 'ТАБЛИЦА · ' : ''}стр. ${s.page}`;
        sourcesEl.appendChild(tag);
      });

      bubble.appendChild(sourcesEl);
    }
    scrollBottom();
  }

  function scrollBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  // ── SEND ──
  async function sendMessage() {
    const question = questionInput.value.trim();
    if (!question || !isIndexed) return;

    questionInput.value = '';
    questionInput.style.height = 'auto';
    sendBtn.disabled = true;

    addUserMessage(question);
    const bubble = addBotMessage();

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Ошибка сервера');
      }

      const data = await res.json();
      renderAnswer(bubble, data.answer, data.sources);

    } catch (e) {
      bubble.textContent = `Ошибка: ${e.message}`;
      bubble.style.borderColor = 'rgba(255,68,102,.3)';
      bubble.style.color = 'var(--error)';
    } finally {
      sendBtn.disabled = false;
      questionInput.focus();
    }
  }
</script>
</body>
</html>
